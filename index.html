<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sort 可視化登入</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <section class="auth-hero">
      <p class="auth-eyebrow">Sort Visualizer</p>
      <h1>排序學習平台</h1>
      <p>依學生或教師身份登入，進入排序視覺化、測驗與教室管理。</p>
    </section>

    <section class="auth-panel">
      <div class="mode-tabs" aria-label="Auth mode">
        <button id="loginModeBtn" class="mode-tab is-active" type="button">登入</button>
        <button id="registerModeBtn" class="mode-tab" type="button">註冊</button>
      </div>

      <div class="role-tabs" aria-label="Role selector">
        <button class="role-tab is-active" type="button" data-role="student">Student</button>
        <button class="role-tab" type="button" data-role="teacher">Teacher</button>
      </div>

      <form id="authForm" class="auth-form">
        <input id="authMode" type="hidden" value="login" />
        <input id="role" type="hidden" value="student" />

        <label>
          <span>帳號 / Email</span>
          <input id="email" type="text" placeholder="student@example.com 或 admin" autocomplete="username" />
          <small id="emailError" class="field-error hidden">學生與教師請輸入正確的電子郵件；管理員可輸入 admin</small>
        </label>

        <label>
          <span>密碼</span>
          <div class="password-field">
            <input id="password" type="password" placeholder="至少 6 個字" autocomplete="current-password" />
            <button id="togglePassword" type="button">顯示</button>
          </div>
          <small id="passwordError" class="field-error hidden">密碼至少 6 個字</small>
        </label>

        <label id="confirmPasswordGroup" class="hidden">
          <span>確認密碼</span>
          <input id="confirmPassword" type="password" placeholder="再次輸入密碼" autocomplete="new-password" />
          <small id="confirmPasswordError" class="field-error hidden">兩次輸入的密碼不一致</small>
        </label>

        <button id="submitBtn" class="auth-submit" type="submit">登入學生帳號</button>
        <p id="formMessage" class="form-message hidden"></p>
      </form>
    </section>
  </main>

  <script src="./js/auth.js"></script>
</body>
</html>
